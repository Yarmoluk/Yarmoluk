<svg xmlns="http://www.w3.org/2000/svg" width="640" height="368" viewBox="0 0 640 368" role="img" aria-label="The stack Daniel Yarmoluk builds: any agent framework, over MCP, to a Compressed Knowledge Graph, with SHA-256 source provenance on every answer">
  <defs>
    <style>
      .m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
      .lbl{font-size:11.5px;font-weight:700;letter-spacing:.09em}
      .det{font-size:10.5px}
      .cap{font-size:10px;letter-spacing:.05em}
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#30475e"/>
    </marker>
  </defs>

  <rect width="640" height="368" rx="8" fill="#0d1117"/>

  <!-- header -->
  <text class="m" x="22" y="30" font-size="12.5" fill="#3fb950">I build the protocol layer that lets agents act on trustworthy context.</text>
  <text class="m cap" x="22" y="48" fill="#7d8590">MODEL FOR LANGUAGE  ·  CONTEXT FOR KNOWLEDGE</text>

  <!-- layer 1 : callers -->
  <rect x="22" y="64" width="596" height="54" rx="6" fill="#161b22" stroke="#21262d"/>
  <rect x="22" y="64" width="3.5" height="54" rx="1.5" fill="#8b5cf6"/>
  <text class="m lbl" x="38" y="84" fill="#e6edf3">CALLING AGENTS</text>
  <text class="m det" x="38" y="103" fill="#7d8590">Claude · GitHub Copilot · Cursor · LangChain · LangGraph · Semantic Kernel · CrewAI · AutoGen</text>

  <line x1="320" y1="118" x2="320" y2="140" stroke="#30475e" stroke-width="1.5" marker-end="url(#a)"/>
  <text class="m cap" x="332" y="134" fill="#58a6ff">one server, unchanged, in every framework</text>

  <!-- layer 2 : MCP -->
  <rect x="22" y="144" width="596" height="66" rx="6" fill="#161b22" stroke="#1f6feb" stroke-opacity=".45"/>
  <rect x="22" y="144" width="3.5" height="66" rx="1.5" fill="#1f6feb"/>
  <text class="m lbl" x="38" y="164" fill="#e6edf3">MCP  ·  6 SERVICES IN PRODUCTION</text>
  <text class="m det" x="38" y="182" fill="#7d8590">JSON-RPC handshake · streamable HTTP + SSE · sessions · transport security · auth · per-method metering</text>
  <text class="m det" x="38" y="199" fill="#7d8590">A2A agent cards · machine-readable economics · x402 / HTTP 402 · EIP-3009 · Base settlement</text>

  <line x1="320" y1="210" x2="320" y2="232" stroke="#30475e" stroke-width="1.5" marker-end="url(#a)"/>
  <text class="m cap" x="332" y="226" fill="#58a6ff">traversal, not similarity search</text>

  <!-- layer 3 : CKG -->
  <rect x="22" y="236" width="596" height="54" rx="6" fill="#161b22" stroke="#21262d"/>
  <rect x="22" y="236" width="3.5" height="54" rx="1.5" fill="#3fb950"/>
  <text class="m lbl" x="38" y="256" fill="#e6edf3">COMPRESSED KNOWLEDGE GRAPH</text>
  <text class="m det" x="38" y="275" fill="#7d8590">307 domain graphs · typed authored edges · multi-hop traversal · REQUIRES / ENABLES / IMPLEMENTS</text>

  <line x1="320" y1="290" x2="320" y2="308" stroke="#30475e" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- layer 4 : provenance -->
  <rect x="22" y="312" width="596" height="38" rx="6" fill="#0f1d17" stroke="#238636" stroke-opacity=".5"/>
  <text class="m det" x="38" y="336" fill="#3fb950">every answer  →  source URL  +  SHA-256 of the bytes it was authored from</text>

  <!-- right rail metrics -->
  <text class="m" x="618" y="84" font-size="10.5" fill="#7d8590" text-anchor="end">framework-agnostic</text>
  <text class="m" x="618" y="164" font-size="12" fill="#e6edf3" text-anchor="end" font-weight="700">269</text>
  <text class="m" x="618" y="178" font-size="9.5" fill="#7d8590" text-anchor="end">tokens · RAG 2,982</text>
  <text class="m" x="618" y="256" font-size="12" fill="#e6edf3" text-anchor="end" font-weight="700">0.471</text>
  <text class="m" x="618" y="270" font-size="9.5" fill="#7d8590" text-anchor="end">F1 · RAG 0.123</text>
</svg>
