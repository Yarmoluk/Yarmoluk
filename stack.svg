<svg xmlns="http://www.w3.org/2000/svg" width="640" height="384" viewBox="0 0 640 384" role="img" aria-label="Context architecture: agents, context routing over MCP, and a knowledge layer with SHA-256 source provenance on every answer">
  <defs>
    <style>
      .m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
      .lbl{font-size:11.5px;font-weight:700;letter-spacing:.1em}
      .det{font-size:10.5px}
      .cap{font-size:10px;letter-spacing:.05em}
      .num{font-size:12px;font-weight:700}
      .unit{font-size:9.5px}
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#30475e"/>
    </marker>
  </defs>

  <rect width="640" height="384" rx="8" fill="#0d1117"/>

  <!-- header -->
  <text class="m" x="22" y="31" font-size="13" fill="#3fb950">CONTEXT ARCHITECTURE</text>
  <text class="m" x="22" y="50" font-size="11.5" fill="#e6edf3">The layer between an agent and everything it is expected to know.</text>
  <text class="m cap" x="22" y="68" fill="#7d8590">MODEL FOR LANGUAGE  ·  CONTEXT FOR KNOWLEDGE</text>

  <!-- layer 1 : agents -->
  <rect x="22" y="84" width="596" height="52" rx="6" fill="#161b22" stroke="#21262d"/>
  <rect x="22" y="84" width="3.5" height="52" rx="1.5" fill="#8b5cf6"/>
  <text class="m lbl" x="38" y="104" fill="#e6edf3">AGENTS</text>
  <text class="m det" x="38" y="122" fill="#7d8590">Claude · GitHub Copilot · Cursor · LangChain · LangGraph · Semantic Kernel · CrewAI · AutoGen</text>
  <text class="m unit" x="618" y="104" fill="#7d8590" text-anchor="end">framework-agnostic</text>

  <line x1="320" y1="136" x2="320" y2="158" stroke="#30475e" stroke-width="1.5" marker-end="url(#a)"/>
  <text class="m cap" x="332" y="152" fill="#58a6ff">one server, unchanged, in every framework</text>

  <!-- layer 2 : context routing -->
  <rect x="22" y="162" width="596" height="80" rx="6" fill="#161b22" stroke="#1f6feb" stroke-opacity=".45"/>
  <rect x="22" y="162" width="3.5" height="80" rx="1.5" fill="#1f6feb"/>
  <text class="m lbl" x="38" y="182" fill="#e6edf3">CONTEXT ROUTING</text>
  <text class="m det" x="38" y="200" fill="#7d8590">Which domain · which subgraph · how deep · what the caller is entitled to · what it will cost</text>
  <text class="m det" x="38" y="217" fill="#7d8590">MCP: JSON-RPC · streamable HTTP + SSE · sessions · transport security · auth · per-method metering</text>
  <text class="m det" x="38" y="234" fill="#7d8590">A2A agent cards · machine-readable economics · x402 / HTTP 402 · EIP-3009 · Base settlement</text>
  <text class="m num" x="618" y="182" fill="#e6edf3" text-anchor="end">6</text>
  <text class="m unit" x="618" y="196" fill="#7d8590" text-anchor="end">services in production</text>
  <text class="m num" x="618" y="219" fill="#e6edf3" text-anchor="end">269</text>
  <text class="m unit" x="618" y="233" fill="#7d8590" text-anchor="end">tokens · RAG 2,982</text>

  <line x1="320" y1="242" x2="320" y2="264" stroke="#30475e" stroke-width="1.5" marker-end="url(#a)"/>
  <text class="m cap" x="332" y="258" fill="#58a6ff">traversal, not similarity search</text>

  <!-- layer 3 : knowledge layer -->
  <rect x="22" y="268" width="596" height="52" rx="6" fill="#161b22" stroke="#21262d"/>
  <rect x="22" y="268" width="3.5" height="52" rx="1.5" fill="#3fb950"/>
  <text class="m lbl" x="38" y="288" fill="#e6edf3">KNOWLEDGE LAYER</text>
  <text class="m det" x="38" y="306" fill="#7d8590">307 domain graphs · typed authored edges · multi-hop · REQUIRES / ENABLES / IMPLEMENTS</text>
  <text class="m num" x="618" y="288" fill="#e6edf3" text-anchor="end">0.471</text>
  <text class="m unit" x="618" y="302" fill="#7d8590" text-anchor="end">F1 · RAG 0.123</text>

  <line x1="320" y1="320" x2="320" y2="336" stroke="#30475e" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- provenance -->
  <rect x="22" y="340" width="596" height="34" rx="6" fill="#0f1d17" stroke="#238636" stroke-opacity=".5"/>
  <text class="m det" x="38" y="362" fill="#3fb950">every answer  →  source URL  +  SHA-256 of the bytes it was authored from</text>
</svg>
